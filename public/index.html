<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15111f"><meta name="description" content="VAULTline — a tiny haunted vault for stronger passwords and safer sign-ins.">
<title>VAULTline  Password Security</title>
<style>
:root{color-scheme:dark;--bg:#15111f;--panel:#211a30;--line:#40324f;--pink:#ff9ed8;--lav:#c6b3ff;--text:#f8f1ff;--muted:#b9adc9;--good:#9ce6bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#392448 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.5 ui-sans-serif,system-ui,sans-serif;min-height:100vh}a{color:var(--pink)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--pink)}.pill{display:none}.hero{padding:64px 0 36px;max-width:720px}.eyebrow{display:none}.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:.99;letter-spacing:-.06em;margin:12px 0 20px}.hero h1 em{font-style:normal;color:var(--pink)}.hero p{color:var(--muted);max-width:580px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:linear-gradient(145deg,#251d35,#1b1627);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 70px #0002}.card h2{margin:0 0 6px}.sub{display:none}.field{display:block;margin:14px 0 6px;font-size:.86rem;color:var(--muted)}input{width:100%;background:#120e1b;border:1px solid #4b3b60;border-radius:12px;padding:12px 13px;color:var(--text);outline:none}input:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ff9ed822}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--pink);color:#211329}.btn.secondary{background:#332644;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.strength{height:8px;background:#100d18;border-radius:99px;overflow:hidden;margin:12px 0}.strength div{height:100%;width:0;background:linear-gradient(90deg,#ff7798,#ffca91,#9ce6bd);transition:width .2s}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;color:var(--muted);font-size:.84rem}.checks span:before{content:"○ ";color:#927fa9}.checks .yes:before{content:" ";color:var(--good)}.message{min-height:24px;margin-top:12px;color:var(--lav);font-size:.9rem}.ghost{font-size:2.3rem;display:inline-block;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px) rotate(4deg)}}footer{display:none}.note{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-top:42px}.wrap{padding:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="wrap">
<nav class="nav"><div class="brand">VAULT<span>line</span></div></nav>
<section class="hero"><h1>Your tiny<br><em>haunted vault.</em></h1><div class="ghost" aria-hidden="true">👻</div></section>
<section class="grid">
<article class="card"><h2>🗝️ Strength spell</h2><label class="field" for="pw">Try a password</label><input id="pw" type="password" autocomplete="new-password" maxlength="256" placeholder="Enter a password">
<div class="strength" role="progressbar" aria-label="Password strength"><div id="bar"></div></div><strong id="strengthLabel">Not checked yet</strong><div id="checks" class="checks"></div><div class="actions"><button class="btn" id="check">Check strength</button><button class="btn secondary" id="toggle" type="button">Show / hide</button></div><div id="strengthMsg" class="message" aria-live="polite"></div></article>
<article class="card"><h2>🔐 Enter the vault</h2><label class="field" for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com">
<label class="field" for="authPw">Password (12+ characters)</label><input id="authPw" type="password" autocomplete="current-password" maxlength="256" placeholder="Enter password">
<div class="actions"><button class="btn" id="login">Sign in</button><button class="btn secondary" id="signup">Create account</button><button class="btn secondary" id="reset">Reset email</button></div><div id="authMsg" class="message" aria-live="polite"></div></article>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const checkNames={length:"12+ characters",upper:"Uppercase letter",lower:"Lowercase letter",number:"Number",symbol:"Symbol",notCommon:"Not a common password"};
$("check").addEventListener("click",async()=>{const password=$("pw").value;$("strengthMsg").textContent="Checking…";try{const r=await fetch("/api/password-strength",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not check.");$("bar").style.width=(d.score/6*100)+"%";$("strengthLabel").textContent=d.label;$("checks").innerHTML=Object.entries(d.checks).map(([k,v])=>'<span class="'+(v?"yes":"")+'">'+checkNames[k]+'</span>').join("");$("strengthMsg").textContent=d.advice;}catch(e){$("strengthMsg").textContent=e.message;}});
$("toggle").addEventListener("click",()=>{$("pw").type=$("pw").type==="password"?"text":"password";});
async function auth(action){const email=$("email").value.trim(),password=$("authPw").value;$("authMsg").textContent="Opening the tiny vault…";try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,email,password})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed.");if(action==="login"&&d.session?.access_token){sessionStorage.setItem("vaultline_access_token",d.session.access_token);sessionStorage.setItem("vaultline_user",JSON.stringify(d.user||{}));$("authMsg").textContent="Welcome back. You’re signed in for this tab. ";}else $("authMsg").textContent=d.message||"Request complete.";}catch(e){$("authMsg").textContent=e.message;}}
$("login").addEventListener("click",()=>auth("login"));$("signup").addEventListener("click",()=>auth("signup"));$("reset").addEventListener("click",()=>auth("reset"));
</script></body></html>
